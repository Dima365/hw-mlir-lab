# IP block registry. Single source of truth:
# opcode, RTL module name, sources, parameters.
- name: matmul
  module: array
  sources:
    - ip/systolic_array_demo/array.sv
  opcode: 1
  params:
    N: 8
    DATA_W: 8
    ACC_W: 32

- name: qadd_relu
  module: qadd_relu
  sources:
    - ip/qadd_relu_demo/qadd_relu.sv
  opcode: 2
  params:
    N: 8
    DATA_W: 8
    PARAM_W: 32
    SHIFT_W: 6

- name: conv_requant
  module: conv_requant
  sources:
    - ip/conv_requant_demo/conv_requant.sv
  opcode: 3
  params:
    N: 8
    ACC_W: 32
    OUT_W: 8
    SHIFT_W: 6
